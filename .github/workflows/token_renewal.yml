name: YouTube Token Renewal

on:
  schedule:
    - cron: '0 0 */3 * *' # Every 3 days
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      secrets: write  # Required to update TOKEN_JSON secret via API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pynacl  # Required for GitHub secret encryption

      # ---- motivation_en ----
      - name: Setup motivation_en Environment
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          CHANNEL_NAME: motivation_en
        run: python scripts/github_env_setup.py

      - name: Renew motivation_en Token
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CHANNEL_NAME: motivation_en
        run: python scripts/renew_tokens.py

      - name: Push motivation_en Token back to GitHub Secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          CHANNEL_NAME: motivation_en
        run: |
          TOKEN_FILE="credentials/motivation_en_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            python3 scripts/update_github_secret.py \
              --repo "${{ github.repository }}" \
              --secret TOKEN_JSON \
              --file "$TOKEN_FILE"
          else
            echo "⚠️ No token file found for motivation_en, skipping secret update."
          fi

      # ---- movies_en ----
      - name: Setup movies_en Environment
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          CHANNEL_NAME: movies_en
        run: python scripts/github_env_setup.py

      - name: Renew movies_en Token
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          CHANNEL_NAME: movies_en
        run: python scripts/renew_tokens.py

      - name: Push movies_en Token back to GitHub Secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          CHANNEL_NAME: movies_en
        run: |
          TOKEN_FILE="credentials/movies_en_token.json"
          if [ -f "$TOKEN_FILE" ]; then
            python3 scripts/update_github_secret.py \
              --repo "${{ github.repository }}" \
              --secret TOKEN_JSON \
              --file "$TOKEN_FILE"
          else
            echo "⚠️ No token file found for movies_en, skipping secret update."
          fi
